<!DOCTYPE html>
<html>
<head>
    <title>Edit Song</title>

    <style>
        body {
            margin: 0;
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
        }

        nav {
            height: 70px;
            background: #000;
            display: flex;
            align-items: center;
            padding: 0 35px;
        }

        .logo {
            color: #1db954;
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #1db954;
        }

        main {
            padding: 50px 35px 120px;
        }

        .song-container {
            max-width: 900px;
            margin: auto;
            background: #181818;
            padding: 40px;
            border-radius: 12px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 20px;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 8px;
            background: #282828;
            color: white;
            border: 1px solid #444;
            border-radius: 6px;
        }

        label {
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 25px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }

        .save-btn {
            background: #1db954;
            color: black;
        }

        .save-btn:hover {
            background: #1ed760;
        }

        .back-btn {
            background: #282828;
            color: white;
        }

        .back-btn:hover {
            background: #3a3a3a;
        }

        .delete-btn {
            background: #e22134;
            color: white;
        }

        .delete-btn:hover {
            background: #b91c2c;
        }

        .buttons {
            margin-top: 25px;
        }

        .delete-form {
            display: inline;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">Spotify</div>

    <a href="{% url 'home' %}">Home</a>

    {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">Profile</a>
        <a href="{% url 'logout' %}">Logout</a>
    {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'signup' %}">Signup</a>
    {% endif %}
</nav>

<main>

    <div class="song-container">

        <h1>Edit Song</h1>

        <!-- Update Song -->
        <form method="post" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="buttons">

                <button type="submit" class="btn save-btn">
                    Update Song
                </button>

                <a href="{% url 'song_detail' object.pk %}"
                   class="btn back-btn">
                    Cancel
                </a>

            </div>

        </form>


        <!-- Delete Song -->
        <form method="post"
              action="{% url 'song_delete' object.pk %}"
              class="delete-form"
              onsubmit="return confirm('Are you sure you want to delete this song?');">

            {% csrf_token %}

            <button type="submit" class="btn delete-btn">
                Delete Song
            </button>

        </form>

    </div>

</main>

</body>
</html>
