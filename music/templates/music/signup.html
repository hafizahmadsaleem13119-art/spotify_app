<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Spotify</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #121212, #000000);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-box {
            width: 420px;
            background: #121212;
            padding: 45px 50px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 32px;
        }

        .logo span {
            color: #1db954;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 26px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            background: #121212;
            border: 1px solid #727272;
            border-radius: 4px;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border: 1px solid white;
        }

        .helptext {
            color: #b3b3b3;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        .signup-btn {
            width: 100%;
            padding: 14px;
            background: #1db954;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: black;
            margin-top: 10px;
        }

        .signup-btn:hover {
            background: #1ed760;
            transform: scale(1.02);
        }

        .login-text {
            text-align: center;
            margin-top: 30px;
            color: #b3b3b3;
            font-size: 14px;
        }

        .login-text a {
            color: white;
            font-weight: bold;
            text-decoration: underline;
        }

        .login-text a:hover {
            color: #1db954;
        }

        .errors {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: -12px;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

<div class="signup-box">

    <div class="logo">
        <h1>🎵 <span>Spotify</span></h1>
    </div>

    <h2>Create your account</h2>

    <form method="POST">

        {% csrf_token %}

        {% for field in form %}

            <label>{{ field.label }}</label>

            {{ field }}

            {% if field.help_text %}
                <div class="helptext">
                    {{ field.help_text }}
                </div>
            {% endif %}

            {% if field.errors %}
                <div class="errors">
                    {{ field.errors }}
                </div>
            {% endif %}

        {% endfor %}

        <button type="submit" class="signup-btn">
            Sign Up
        </button>

    </form>

    <div class="login-text">
        Already have an account?
        <a href="{% url 'login' %}">Log in</a>
    </div>

</div>

</body>
</html>
