<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Playlist</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #121212;
            color: white;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .playlist-container {

            width: 420px;

            background: #181818;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.5);
        }


        h1 {

            text-align: center;

            margin-bottom: 30px;

            font-size: 28px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #ccc;

            font-size: 14px;
        }


        input {

            width: 100%;

            padding: 13px;

            background: #282828;

            border: 1px solid #444;

            border-radius: 6px;

            color: white;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #1db954;
        }


        .create-btn {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 25px;

            background: #1db954;

            color: black;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .create-btn:hover {

            background: #1ed760;

            transform: scale(1.02);
        }


        .back-btn {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #aaa;

            text-decoration: none;

            font-size: 14px;
        }


        .back-btn:hover {

            color: white;
        }

    </style>

</head>


<body>


    <div class="playlist-container">


        <h1>
            🎵 Create Playlist
        </h1>


        <form method="POST">

            {% csrf_token %}


            <label for="{{ form.name.id_for_label }}">
                Playlist Name
            </label>


            {{ form.name }}


            <button
                type="submit"
                class="create-btn"
            >
                Create Playlist
            </button>

        </form>


        <a
            href="{% url 'home' %}"
            class="back-btn"
        >
            ← Back to Home
        </a>


    </div>


</body>

</html>
