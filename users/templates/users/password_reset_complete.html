
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Reset Complete - Spotify</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #121212, #000000);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reset-box {
            width: 420px;
            background: #121212;
            padding: 45px 50px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 32px;
        }

        .logo span {
            color: #1db954;
        }

        h2 {
            margin-bottom: 20px;
        }

        p {
            color: #b3b3b3;
            font-size: 14px;
            line-height: 1.6;
        }

        .login-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 30px;
            background: #1db954;
            color: black;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .login-btn:hover {
            background: #1ed760;
        }
    </style>
</head>

<body>

<div class="reset-box">

    <div class="logo">
        <h1>🎵 <span>Spotify</span></h1>
    </div>

    <h2>Password Reset Successful</h2>

    <p>
        Your password has been successfully changed.
    </p>

    <p>
        You can now log in using your new password.
    </p>

    <a href="{% url 'login' %}" class="login-btn">
        Log In
    </a>

</div>

</body>
</html>
