
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password - Spotify</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #121212, #000000);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reset-box {
            width: 420px;
            background: #121212;
            padding: 45px 50px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 32px;
        }

        .logo span {
            color: #1db954;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #121212;
            border: 1px solid #727272;
            border-radius: 4px;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border: 1px solid white;
        }

        .reset-btn {
            width: 100%;
            padding: 14px;
            background: #1db954;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: black;
        }

        .reset-btn:hover {
            background: #1ed760;
        }

        .error {
            background: #2a1515;
            color: #ff6b6b;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="reset-box">

    <div class="logo">
        <h1>🎵 <span>Spotify</span></h1>
    </div>

    <h2>Set New Password</h2>

    {% if form.errors %}
        <div class="error">
            Please correct the errors below.
        </div>
    {% endif %}

    {% if validlink %}

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="reset-btn">
                Reset Password
            </button>

        </form>

    {% else %}

        <div class="error">
            This password reset link is invalid or has expired.
        </div>

    {% endif %}

</div>

</body>
</html>
