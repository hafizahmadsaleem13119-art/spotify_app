```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Spotify</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #121212, #000000);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reset-box {
            width: 420px;
            background: #121212;
            padding: 45px 50px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            margin: 0;
            font-size: 32px;
        }

        .logo span {
            color: #1db954;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .info {
            color: #b3b3b3;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #121212;
            border: 1px solid #727272;
            border-radius: 4px;
            color: white;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border: 1px solid white;
        }

        .reset-btn {
            width: 100%;
            padding: 14px;
            background: #1db954;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: black;
        }

        .reset-btn:hover {
            background: #1ed760;
        }

        .back-login {
            text-align: center;
            margin-top: 25px;
        }

        .back-login a {
            color: white;
            font-size: 14px;
            text-decoration: underline;
        }

        .back-login a:hover {
            color: #1db954;
        }

        .error {
            color: #ff4d4d;
            font-size: 13px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="reset-box">

    <div class="logo">
        <h1>🎵 <span>Spotify</span></h1>
    </div>

    <h2>Forgot Password?</h2>

    <p class="info">
        Enter the email address associated with your account
        and we'll send you a password reset link.
    </p>

    <form method="POST" action="{% url 'password_reset' %}">

        {% csrf_token %}

        <label for="{{ form.email.id_for_label }}">
            Email
        </label>

        {{ form.email }}

        {% if form.email.errors %}
            <div class="error">
                {{ form.email.errors }}
            </div>
        {% endif %}

        <button type="submit" class="reset-btn">
            Send Reset Link
        </button>

    </form>

    <div class="back-login">
        <a href="{% url 'login' %}">
            Back to Login
        </a>
    </div>

</div>

</body>
</html>
```
